<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>SAE2.03 ADMIN</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./component/MovieForm/style.css" />
  </head>
<body>
    <header id="header"></header> 
    <section id="log"></section>
    <section id="content"></section>

   <script type="module">
    import { Log } from "./component/Log/script.js";
    import { DataMovie } from "./data/dataMovie.js";
    import { DataProfile } from "./data/dataProfile.js";
    import { MovieForm } from "./component/MovieForm/script.js"; 
    import { ProfileForm } from "./component/ProfileForm/script.js";
    import { AdminNav } from "./component/AdminNav/script.js";

    window.C = {};
    window.V = {};

// GESTION DES FILMS 
    C.handlerShowMovieForm = function() {
        document.querySelector("#content").innerHTML = MovieForm.format(); 
        MovieForm.listenSubmit(); 
    };

    C.handlerAddMovie = async function(formData) {
        let res = await DataMovie.add(formData);
        if (res) alert("Film ajouté !");
    };

    //GESTION DES PROFILS
    C.handlerShowProfileForm = function() {
        document.querySelector("#content").innerHTML = ProfileForm.format(); 
        ProfileForm.listenSubmit(); 
    };

    C.handlerAddProfile = async function(formData) {
        let res = await DataProfile.add(formData);
        if (res) alert("Profil ajouté avec succès !");
    };

    // LOG 
    C.handlerLog = function() {
        let logSection = document.querySelector("#log");
        if (logSection) {
            logSection.innerHTML = Log.format();
            if (Log.listen) Log.listen(); 
        }
    };

    C.start = async function () {
        C.handlerLog();
        document.querySelector("#header").innerHTML = AdminNav.format();
        AdminNav.listen();
        C.handlerShowProfileForm();
    };

    C.start();
</script>
