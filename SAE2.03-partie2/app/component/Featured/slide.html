<div class="hero-carousel__slide">
    <img src="../server/images/banner/{{affiche}}" alt="{{name}}" class="hero-carousel__image">
    <div class="hero-carousel__caption">
        <h1 class="hero-carousel__title">{{name}}</h1>
        <p class="hero-carousel__description">{{description}}</p>
        <button class="hero-carousel__action" onclick="C.handlerMovieDetail('{{id}}')">Voir les détails</button>
    </div>
</div>
