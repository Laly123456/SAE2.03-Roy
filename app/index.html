<!DOCTYPE html>
<html lang="fr">
<head>
  <title>SAE2.03 APP</title>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./component/Movie/style.css" />
  <link rel="stylesheet" href="./component/NavBar/style.css" />
  <link rel="stylesheet" href="./component/MovieDetail/style.css" />
</head>
<body>
  <header id="header"></header>
  <section id="content"></section>

<script type="module">
    import { NavBar } from "./component/NavBar/script.js";
    import { Movie } from "./component/Movie/script.js";
    import { MovieDetail } from "./component/MovieDetail/script.js";
    import { DataMovie } from "./data/dataMovie.js";
    import { DataProfile } from "./data/dataProfile.js";
    import { DataFavorite } from "./data/dataFavorite.js";

    window.C = {};
    window.V = {}; 
    window.currentProfile = null;
    window.currentAge = 99;

    C.handlerMovie = async function() {
        const movies = await DataMovie.requestMovies(window.currentAge);
        V.renderMovies(movies);
    };

    C.handlerHome = function() {
        C.handlerMovie();
    };

    C.handlerMovieDetail = async function(id) {
        const movie = await DataMovie.requestMovieById(id);
        V.renderMovieDetail(movie);
    };

    C.handlerMovieCategory = async function(id) {
        const movies = await DataMovie.requestMoviesByCategory(id, window.currentAge);
        V.renderMovies(movies);
    };

    C.handlerToggleFavorite = async function(id_movie) {
        let id = (typeof id_movie === 'object') ? id_movie.id : id_movie;
        if (!window.currentProfile) return alert("Choisissez un profil !");
        
        const res = await DataFavorite.add(id, window.currentProfile);
        if(res) alert("Ajouté aux favoris ! ");
    };

    C.handlerSelectProfile = function(id, name, avatar, age) {
        window.currentProfile = id;
        window.currentAge = age; 
        if (NavBar.activeProfile) NavBar.activeProfile(name, avatar);
        C.handlerMovie();
    };

    C.handlerMyList = async function() {
        if (!window.currentProfile) return alert("Choisissez un profil !");
        const favs = await DataFavorite.read(window.currentProfile, window.currentAge);
        V.renderMovies(favs);
    };

    C.start = async function() {
        document.querySelector("#header").innerHTML = NavBar.format("");
        const [profiles, cats] = await Promise.all([DataProfile.read(), DataMovie.requestAllCategories()]);
        if (cats) NavBar.fillNames(cats);
        if (profiles) NavBar.fillProfiles(profiles);
        
        const movies = await DataMovie.requestMovies(99); 
        V.renderMovies(movies);
    };

    V.renderMovies = function(movies) {
        let content = document.querySelector("#content");
        content.className = "movie-grid";
        content.innerHTML = (Array.isArray(movies) && movies.length > 0) 
            ? movies.map(m => Movie.format(m)).join('') 
            : "<p>Aucun film.</p>";
    };

    V.renderMovieDetail = function(movie) {
        let content = document.querySelector("#content");
        content.className = "movie-detail-view";
        content.innerHTML = MovieDetail.format(movie);
    };

    C.start();
</script>
</body>
</html>
